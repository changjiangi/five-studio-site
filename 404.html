<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Stage Not Found | Five Studio</title>
  <meta name="theme-color" content="#0d1f17" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <canvas id="dot-matrix" aria-hidden="true"></canvas>
  <div class="site-shell">
    <main class="error-stage">
      <div class="container">
        <div class="error-box" style="margin: 0 auto;">
          <img src="/assets/logo-mark.svg" alt="Five Studio Logo" width="76" height="54" style="margin: 0 auto;" />
          <p class="error-code">404</p>
          <p class="section-eyebrow" style="margin-bottom: 12px;">STAGE NOT FOUND</p>
          <p style="color: var(--ink-secondary); margin: 0 0 26px;">
            Looks like you wandered off the map. Let's get you back to base camp.
          </p>
          <a class="btn btn-primary" href="/">Return to Five Studio</a>
        </div>
      </div>
    </main>
  </div>
  <script src="/app.js" defer></script>
</body>
</html>
